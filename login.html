<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Mobile Hub - Staff Login</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #f4f6f9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .login-box { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
            width: 100%; 
            max-width: 350px; 
            text-align: center; 
        }
        h2 { 
            color: #2563eb; 
            margin-bottom: 20px; 
        }
        .form-group { 
            margin-bottom: 15px; 
            text-align: left; 
        }
        label { 
            display: block; 
            margin-bottom: 5px; 
            font-weight: bold; 
            color: #475569; 
        }
        input { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #cbd5e1; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 14px;
        }
        button { 
            width: 100%; 
            background: #2563eb; 
            color: white; 
            border: none; 
            padding: 12px; 
            border-radius: 6px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 10px; 
        }
        button:hover { 
            background: #1d4ed8; 
        }
        .back-link { 
            display: inline-block; 
            margin-top: 15px; 
            color: #64748b; 
            text-decoration: none; 
            font-size: 14px; 
        }
        .back-link:hover {
            color: #2563eb;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>🔒 Owner Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter Admin Username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter Secure Password" required>
            </div>
            <button type="submit">Verify & Login</button>
        </form>
        <a href="index.html" class="back-link">← Back to Shop</a>
    </div>

   <script>
    // FIXED: Full live hosted domain configure kiya
    const API_URL = "https://onrender.com";

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const loginData = {
            user: document.getElementById('username').value,
            pass: document.getElementById('password').value
        };

        try {
            const response = await fetch(`${API_URL}/admin-login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(loginData)
            });

            const result = await response.json();

            if (response.ok) {
                sessionStorage.setItem("admin_token", result.token);
                alert("🔓 Access Granted! Dashboard open ho raha hai...");
                window.location.href = "./admin.html"; 
            } else {
                alert("❌ Login Error: " + result.error);
            }
        } catch (error) {
            console.error("Login crashed:", error);
            alert("Live backend server se connection nahi ho paa raha hai. Kuch der baad koshish karein.");
        }
    });
</script>



</body>
</html>
