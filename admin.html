<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Mobile Hub - Dashboard & Sales</title>
    
    <style>
        body { 
            display: none; 
            font-family: Arial, sans-serif; 
            background: #f4f6f9; 
            padding: 20px; 
        }
        .container { display: flex; gap: 20px; flex-wrap: wrap; max-width: 1200px; margin: 0 auto; }
        .box { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); flex: 1; min-width: 300px; }
        h2 { color: #2563eb; margin-bottom: 20px; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; background: #2563eb; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        th { background: #f8fafc; color: #475569; }
        .total-box { background: #10b981; color: white; padding: 15px; border-radius: 8px; margin-top: 15px; font-size: 18px; font-weight: bold; text-align: center;}
    </style>

    <!-- SECURE GATEWAY CHECK 
    <script>
        (function() {
            // Agar secure login token nahi milti toh turant block karke login page par phek do
            if (sessionStorage.getItem("admin_token") !== "bearer_session_auth_token_999777") {
                sessionStorage.clear();
                alert("🚨 Security Block: Pehle valid portal se login kijiye.");
                window.location.replace("./login.html");
            } else {
                document.addEventListener("DOMContentLoaded", () => {
                    document.body.style.display = "block";
                });
            }
        })();
    </script>-->
</head>
<body>

    <div style="max-width: 1200px; margin: 0 auto 10px; text-align: right;">
        <button id="logoutBtn" style="background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; width: auto; display: inline-block;">
            🔒 Close Session (Logout)
        </button>
    </div>

    <h1 style="text-align:center; color:#1e293b; margin-bottom:30px;">🏪 Shop Central Control (Admin)</h1>

    <div class="container">
        <!-- 1. PRODUCT ADD FORM -->
        <div class="box">
            <h2>➕ Add New Item</h2>
            <form id="addProductForm">
                <div class="form-group"><label>Category</label>
                    <select id="pCategory">
                        <option value="phone">Smartphone</option>
                        <option value="laptop">Laptop</option>
                        <option value="tablet">Tablet</option>
                    </select>
                </div>
                <div class="form-group"><label>Brand</label><input type="text" id="pBrand" required></div>
                <div class="form-group"><label>Product Name</label><input type="text" id="pName" required></div>
                <div class="form-group"><label>Price (Pure Numeric Integer Only)</label><input type="number" id="pPrice" required></div>
                <div class="form-group"><label>Image URL</label><input type="url" id="pImg" required></div>
                <div class="form-group"><label>RAM/Storage</label><input type="text" id="pRam" placeholder="8GB/128GB" required></div>
                <div class="form-group"><label>Processor</label><input type="text" id="pProcessor" required></div>
                <div class="form-group"><label>Battery</label><input type="text" id="pBattery" required></div>
                <button type="submit">Add Product</button>
            </form>
        </div>

        <!-- 2. SALES TRACKER DASHBOARD -->
        <div class="box">
            <h2>📊 Real-time Sales Counter</h2>
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Item</th>
                        <th>Customer</th>
                        <th>Phone</th>
                        <th>Amount</th>
                    </tr>
                </thead>
                <tbody id="salesTableBody"></tbody>
            </table>
            <div class="total-box" id="totalEarnings">Total Sale: ₹0</div>
        </div>
    </div>
<script>
    // FIXED: Cleaned up URL endpoint string
    const API_URL = "https://onrender.com";

    async function loadSalesFromPython() {
        try {
            const response = await fetch(`${API_URL}/get-sales`);
            if (!response.ok) {
                throw new Error(`Server status: ${response.status}`);
            }
            const sales = await response.json();
            const tableBody = document.getElementById('salesTableBody');
            if(!tableBody) return;
            
            let total = 0;
            tableBody.innerHTML = "";

            sales.forEach(item => {
                let numPrice = Number(item.price.replace(/[^0-9]/g, ''));
                total += numPrice;

                const row = document.createElement('tr');
                const tdDate = document.createElement('td'); tdDate.textContent = item.date;
                const tdItem = document.createElement('td'); tdItem.innerHTML = `<b></b>`; tdItem.querySelector('b').textContent = item.productName;
                const tdCust = document.createElement('td'); tdCust.textContent = item.customerName;
                const tdPhon = document.createElement('td'); tdPhon.textContent = item.customerPhone;
                const tdPric = document.createElement('td'); tdPric.style.color = "#10b981"; tdPric.style.fontWeight = "bold"; tdPric.textContent = item.price;
                
                row.appendChild(tdDate); row.appendChild(tdItem); row.appendChild(tdCust); row.appendChild(tdPhon); row.appendChild(tdPric);
                tableBody.appendChild(row);
            });
            
            const totalEarningsElement = document.getElementById('totalEarnings');
            if(totalEarningsElement) {
                totalEarningsElement.innerText = "Total Store Sale: ₹" + total.toLocaleString('en-IN');
            }
        } catch(err) {
            console.error("Sales data rendering failure:", err);
        }
    }

    document.getElementById('addProductForm')?.addEventListener('submit', async function(e) {
        e.preventDefault();

        const newProduct = {
            category: document.getElementById('pCategory').value,
            brand: document.getElementById('pBrand').value,
            name: document.getElementById('pName').value,
            price: Number(document.getElementById('pPrice').value),
            img: document.getElementById('pImg').value,
            ram: document.getElementById('pRam').value,
            processor: document.getElementById('pProcessor').value,
            battery: document.getElementById('pBattery').value
        };

        try {
            const response = await fetch(`${API_URL}/add-product`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newProduct)
            });

            if(response.ok) {
                alert("🎉 Product marketplace par successfully live ho gaya!");
                this.reset();
                loadSalesFromPython();
            } else {
                alert("❌ Product add nahi hua! Server error.");
            }
        } catch (error) {
            console.error("Product insert crash:", error);
            alert("Server pipeline connection failure.");
        }
    });

    document.getElementById('logoutBtn')?.addEventListener('click', function() {
        if(confirm("Are you sure you want to logout?")) {
            sessionStorage.clear();
            window.location.replace("./login.html");
        }
    });

    loadSalesFromPython();
    setInterval(loadSalesFromPython, 8000);
</script>

</body>
</html>
